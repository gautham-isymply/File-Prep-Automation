id: taiwan
description: Taiwan daily earned/paid/OT hours - check dates, missing days, nulls and negatives
processor: tabular
columns:
  required: [Date, Earn_Hours, Paid_Hours, Overtime_Hours]
  aliases:
    Earn_Hours: [Earn Hours, Earned Hours, Earned_Hours]
    Paid_Hours: [Paid Hours]
    Overtime_Hours: [Overtime Hours, OT Hours]
  numeric: [Earn_Hours, Paid_Hours, Overtime_Hours]
  negative_forbidden: [Earn_Hours, Paid_Hours, Overtime_Hours]
dates:
  - {column: Date, input: MDY, excel_format: m/d/yyyy}
date_continuity_column: Date
output: {format: csv, sheet: Taiwan}
