id: cbg_core
description: CBG Starline Core2 - strip preamble/totals, write Core tab and numeric Pay Rate
processor: tabular
skip_summary_rows: true
header_scan_rows: 45
columns:
  required: [Pay Rate]
  aliases:
    Pay Rate: [PayRate, PAY RATE]
  numeric: [Pay Rate]
  negative_forbidden: [Pay Rate]
reconciliation:
  - name: core_reg_hours
    column: Hours/Units
    filters: [{column: Pay Code, in: [REG]}]
  - name: core_ot_hours
    column: Hours/Units
    filters: [{column: Pay Code, in: [OT]}]
output: {format: xlsx, sheet: Core}
