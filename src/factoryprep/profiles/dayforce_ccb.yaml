id: dayforce_ccb
description: Dayforce CCB - remove Receiving Farmingdale and validate US hours
processor: tabular
external_refresh: true
columns:
  required: [Cost_Center, Pay_Date, Location, Pay_Category, Normal]
  aliases:
    Cost_Center: [Cost Center]
    Pay_Date: [Pay Date]
    Pay_Category: [Pay Category]
  numeric: [Normal]
  negative_forbidden: [Normal]
dates:
  - {column: Pay_Date, input: MDY, excel_format: m/d/yyyy}
exclude_rows:
  - {column: Cost_Center, contains: '3600172100', expect_label_contains: Receiving Farmingdale}
reconciliation:
  - name: us_ccb_reg_hours
    column: Normal
    filters:
      - {column: Pay_Category, in: [Reg]}
      - {column: Location, in: [DPC CCB]}
      - {column: Cost_Center, contains_any: ['1000 > Direct Labor','1001 > Direct Labor','1002 > Direct Labor','1003 > Direct Labor','1004 > Direct Labor','1005 > Direct Labor']}
  - name: us_ccb_ot_hours
    column: Normal
    filters:
      - {column: Pay_Category, in: ['OT 1.5']}
      - {column: Location, in: [DPC CCB]}
      - {column: Cost_Center, contains_any: ['1000 > Direct Labor','1001 > Direct Labor','1002 > Direct Labor','1003 > Direct Labor','1004 > Direct Labor','1005 > Direct Labor']}
output: {format: xlsx, sheet: Dayforce_CCB}
