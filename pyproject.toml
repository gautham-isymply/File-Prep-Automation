[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factoryprep"
version = "0.1.0"
description = "Config-driven Factory Insights source-file preparation and quality checks; no BW integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
factoryprep = "factoryprep.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
